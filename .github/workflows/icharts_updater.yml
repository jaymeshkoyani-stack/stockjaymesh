name: iCharts Live Auto-Updater Cron

on:
  schedule:
    # Run every 15 minutes during Indian market hours (Mon-Fri)
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Fetch Live iCharts Data
        run: |
          python fetch_all_216_full.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json backend_store.json
          git commit -m "Auto-update live iCharts dataset [skip ci]" || exit 0
          git push
